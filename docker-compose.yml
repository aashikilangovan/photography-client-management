services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: photography
      POSTGRES_USER: photography
      POSTGRES_PASSWORD: photography
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U photography']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - '8000:8000'
    environment:
      # Forces Postgres regardless of what DB_CONNECTION says in backend/.env
      # (that file defaults to SQLite, for running without Docker at all).
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: photography
      DB_USERNAME: photography
      DB_PASSWORD: photography
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_vendor:
  frontend_node_modules:
